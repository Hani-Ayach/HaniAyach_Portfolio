name: CI

on:
  push:
    branches: [main, portfolio-v2]
  pull_request:

jobs:
  test-build-lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.14.x autorun
